name: PromptFlow chat and interpreter tests
on:
  push:
    paths: ['assets/promptflow*', 'promptflow.html', 'promptflow-cli/**', 'scripts/promptflow*.test.mjs', '.github/workflows/promptflow-tests.yml']
  pull_request:
    paths: ['assets/promptflow*', 'promptflow.html', 'promptflow-cli/**', 'scripts/promptflow*.test.mjs', '.github/workflows/promptflow-tests.yml']
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install ./promptflow-cli
      - run: node --test --test-reporter=tap scripts/promptflow-chat.test.mjs scripts/promptflow-budget.test.mjs scripts/promptflow-actions.test.mjs scripts/promptflow-model-controls.test.mjs scripts/promptflow-ux.test.mjs > chat-test-results.tap
      - run: python -m unittest discover -s promptflow-cli/tests -v > interpreter-test-results.txt 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: promptflow-test-results
          path: |
            chat-test-results.tap
            interpreter-test-results.txt
