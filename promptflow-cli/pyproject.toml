[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "promptflow-cli"
version = "0.3.1"
description = "PromptFlow™ language CLI and interpreter for prompting neural networks."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "UNLICENSED" }
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "rich>=13.0",
]

[project.scripts]
promptflow = "promptflow_cli.app:app"

[tool.hatch.build.targets.wheel]
packages = ["src/promptflow_cli"]
